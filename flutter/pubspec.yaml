name: opencode_flutter_spike
description: OpenCode v2 Flutter SSE client spike
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  fetch_client: ^1.2.1
  # Owned-in-Rust QUIC (HTTP/3) client — quinn + h3 via flutter_rust_bridge.
  # Used for the QUIC path of the desktop transport; rhttp stays for the
  # HTTP/2 fallback.
  quic_transport:
    path: quic_transport
  # HTTP/1.1–3 client backed by Rust (reqwest). Used on desktop only, for
  # QUIC/HTTP-3 with an HTTP/2 fallback. Pinned: 0.14+ requires Flutter 3.35.
  rhttp: 0.13.0
  # rhttp 0.13 pins flutter_rust_bridge to =2.11.1 in its Cargo.toml, so the
  # compiled Rust speaks the 2.11.1 wire format. Letting pub resolve 2.12.0
  # makes the Dart side and Rust side disagree; rhttp's
  # `forceSameCodegenVersion: false` hides the warning, but the mismatch still
  # panics on the callback path. Keep this pinned in lockstep with rhttp.
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
